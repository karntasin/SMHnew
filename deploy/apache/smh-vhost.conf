# SMH Laravel — Virtual Host สำหรับ Cloudflare Tunnel (ฟัง localhost เท่านั้น)
# ติดตั้ง: deploy\scripts\install-apache-vhost.ps1
#
# ทดสอบในเครื่อง: เพิ่มใน C:\Windows\System32\drivers\etc\hosts
#   127.0.0.1  smh.local

Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    ServerName smh.local
    ServerAlias smh.yourdomain.com
    DocumentRoot "D:/Xampp/htdocs/sss/my-app/public"

    <Directory "D:/Xampp/htdocs/sss/my-app/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteCond %{HTTP:X-Forwarded-Proto} =https [OR]
        RewriteCond %{HTTP:CF-Visitor} '"scheme":"https"'
        RewriteRule .* - [E=HTTPS:on]
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    ErrorLog "logs/smh-vhost-error.log"
    CustomLog "logs/smh-vhost-access.log" common
</VirtualHost>
